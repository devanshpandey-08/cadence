# Docker Compose for Cadence Enterprise Development
version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: cadence-postgres
    environment:
      POSTGRES_USER: cadence
      POSTGRES_PASSWORD: cadence_dev_password_change_in_prod
      POSTGRES_DB: cadence_enterprise
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cadence"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cadence-network

  # Redis Cache & Queue
  redis:
    image: redis:7-alpine
    container_name: cadence-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cadence-network

  # Backend API
  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: cadence-api
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgres://cadence:cadence_dev_password_change_in_prod@postgres:5432/cadence_enterprise
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev_jwt_secret_change_in_prod
      FRONTEND_URL: http://localhost:5173
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: us-east-1
    ports:
      - "3000:3000"
    volumes:
      - ../backend/src:/app/src
      - ../backend/package.json:/app/package.json
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cadence-network
    command: npm run dev

  # Frontend (Vite)
  frontend:
    image: node:20-alpine
    container_name: cadence-frontend
    working_dir: /app
    volumes:
      - ../frontend:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:3000/api/v2
      VITE_WS_URL: ws://localhost:3000
    depends_on:
      - api
    networks:
      - cadence-network

  # Worker Queue Processor
  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: cadence-worker
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://cadence:cadence_dev_password_change_in_prod@postgres:5432/cadence_enterprise
      REDIS_URL: redis://redis:6379
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY}
    depends_on:
      - postgres
      - redis
    networks:
      - cadence-network
    command: npm run worker

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: cadence-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "9090:9090"
    networks:
      - cadence-network
    depends_on:
      - api

  # Grafana Dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: cadence-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin_change_in_prod
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "3001:3001"
    networks:
      - cadence-network
    depends_on:
      - prometheus

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  cadence-network:
    driver: bridge
