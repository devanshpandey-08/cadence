<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadence OS - Full Ecosystem Prototype</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        .animate-fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 antialiased h-screen overflow-hidden">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const { 
            LayoutDashboard, Users, MessageSquare, Calendar, Settings, 
            LogOut, Bell, Search, Plus, MoreHorizontal, Activity, 
            TrendingUp, Shield, Zap, CheckCircle, XCircle, Clock,
            BarChart3, Mail, Phone, MapPin, Globe, FileText, Play,
            Bot, Brain, Cpu, Share2, Filter, Download, RefreshCw
        } = lucide;

        // --- Mock Data Generators ---
        const generateLeads = (count) => Array.from({ length: count }, (_, i) => ({
            id: i + 1,
            name: [`Alex Rivera`, `Sarah Chen`, `Marcus Johnson`, `Emily Davis`, `David Kim`][i % 5],
            company: [`TechFlow`, `Nexus Inc`, `GlobalSoft`, `Innovate Lab`, `Future Systems`][i % 5],
            email: `user${i+1}@example.com`,
            status: ['New', 'Contacted', 'Qualified', 'Proposal', 'Closed'][i % 5],
            score: Math.floor(Math.random() * 100),
            lastActive: `${Math.floor(Math.random() * 24)}h ago`,
            avatar: `https://i.pravatar.cc/150?u=${i}`
        }));

        const generateSwarmLogs = () => [
            { id: 1, agent: 'Strategist-01', action: 'Optimizing campaign #401 bid strategy', time: 'Just now', status: 'success' },
            { id: 2, agent: 'Creator-04', action: 'Generated 5 ad variants for Q3 launch', time: '2m ago', status: 'success' },
            { id: 3, agent: 'Analyst-02', action: 'Detected churn risk in Segment A', time: '5m ago', status: 'warning' },
            { id: 4, agent: 'Sales-01', action: 'Sent follow-up email to lead #842', time: '12m ago', status: 'success' },
            { id: 5, agent: 'Compliance-01', action: 'Audited 1,200 contacts for GDPR', time: '1h ago', status: 'success' },
        ];

        // --- Components ---

        // 1. Login Screen
        const LoginScreen = ({ onLogin }) => {
            const [email, setEmail] = useState('demo@cadence.os');
            const [password, setPassword] = useState('password');
            const [loading, setLoading] = useState(false);

            const handleSubmit = (e) => {
                e.preventDefault();
                setLoading(true);
                setTimeout(() => {
                    setLoading(false);
                    onLogin({ name: 'Demo User', role: 'Admin', company: 'Acme Marketing' });
                }, 1500);
            };

            return (
                <div className="min-h-screen flex items-center justify-center bg-gradient-to-br from-indigo-900 via-purple-900 to-slate-900 p-4">
                    <div className="bg-white/10 backdrop-blur-lg border border-white/20 p-8 rounded-2xl w-full max-w-md shadow-2xl animate-fade-in">
                        <div className="text-center mb-8">
                            <div className="inline-flex items-center justify-center w-16 h-16 rounded-xl bg-gradient-to-tr from-indigo-500 to-purple-500 mb-4 shadow-lg">
                                <Zap className="w-8 h-8 text-white" />
                            </div>
                            <h1 className="text-3xl font-bold text-white mb-2">Cadence OS</h1>
                            <p className="text-indigo-200">The Autonomous Marketing Ecosystem</p>
                        </div>
                        
                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div>
                                <label className="block text-sm font-medium text-indigo-200 mb-1">Email</label>
                                <input 
                                    type="email" 
                                    value={email}
                                    onChange={(e) => setEmail(e.target.value)}
                                    className="w-full px-4 py-3 rounded-lg bg-white/5 border border-white/10 text-white placeholder-indigo-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all"
                                    placeholder="name@company.com"
                                />
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-indigo-200 mb-1">Password</label>
                                <input 
                                    type="password" 
                                    value={password}
                                    onChange={(e) => setPassword(e.target.value)}
                                    className="w-full px-4 py-3 rounded-lg bg-white/5 border border-white/10 text-white placeholder-indigo-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all"
                                    placeholder="••••••••"
                                />
                            </div>
                            <button 
                                type="submit" 
                                disabled={loading}
                                className="w-full py-3 px-4 bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white font-semibold rounded-lg shadow-lg transform transition hover:scale-[1.02] disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center"
                            >
                                {loading ? (
                                    <RefreshCw className="w-5 h-5 animate-spin" />
                                ) : (
                                    <>Sign In to Dashboard <LogOut className="w-4 h-4 ml-2 rotate-180" /></>
                                )}
                            </button>
                        </form>
                        
                        <div className="mt-6 text-center text-xs text-indigo-300">
                            <p>Secured by Row-Level Security • SOC 2 Compliant</p>
                            <p className="mt-1">Demo Mode: Click "Sign In" to enter</p>
                        </div>
                    </div>
                </div>
            );
        };

        // 2. Sidebar Navigation
        const Sidebar = ({ activeTab, setActiveTab, onLogout }) => {
            const menuItems = [
                { id: 'dashboard', icon: LayoutDashboard, label: 'Dashboard' },
                { id: 'crm', icon: Users, label: 'CRM & Contacts' },
                { id: 'swarm', icon: Brain, label: 'AI Swarms' },
                { id: 'social', icon: Share2, label: 'Social Command' },
                { id: 'automation', icon: Zap, label: 'Automation' },
                { id: 'analytics', icon: BarChart3, label: 'Analytics' },
                { id: 'settings', icon: Settings, label: 'Settings' },
            ];

            return (
                <div className="w-64 bg-slate-900 border-r border-slate-800 flex flex-col h-full">
                    <div className="p-6 flex items-center space-x-3">
                        <div className="w-8 h-8 rounded-lg bg-gradient-to-tr from-indigo-500 to-purple-500 flex items-center justify-center">
                            <Zap className="w-5 h-5 text-white" />
                        </div>
                        <span className="text-xl font-bold text-white tracking-tight">Cadence</span>
                    </div>

                    <nav className="flex-1 px-4 space-y-1 overflow-y-auto">
                        {menuItems.map((item) => (
                            <button
                                key={item.id}
                                onClick={() => setActiveTab(item.id)}
                                className={`w-full flex items-center space-x-3 px-4 py-3 rounded-lg transition-all duration-200 ${
                                    activeTab === item.id 
                                        ? 'bg-indigo-600/10 text-indigo-400 border border-indigo-600/20' 
                                        : 'text-slate-400 hover:bg-slate-800 hover:text-white'
                                }`}
                            >
                                <item.icon className="w-5 h-5" />
                                <span className="font-medium">{item.label}</span>
                            </button>
                        ))}
                    </nav>

                    <div className="p-4 border-t border-slate-800">
                        <div className="flex items-center space-x-3 px-4 py-3 mb-2">
                            <div className="w-8 h-8 rounded-full bg-gradient-to-r from-emerald-400 to-cyan-500 flex items-center justify-center text-xs font-bold text-white">
                                DU
                            </div>
                            <div className="flex-1 min-w-0">
                                <p className="text-sm font-medium text-white truncate">Demo User</p>
                                <p className="text-xs text-slate-500 truncate">Admin Workspace</p>
                            </div>
                        </div>
                        <button 
                            onClick={onLogout}
                            className="w-full flex items-center space-x-3 px-4 py-2 text-sm text-slate-400 hover:text-red-400 transition-colors"
                        >
                            <LogOut className="w-4 h-4" />
                            <span>Sign Out</span>
                        </button>
                    </div>
                </div>
            );
        };

        // 3. Dashboard View
        const DashboardView = () => {
            const [metrics, setMetrics] = useState({ leads: 84291, revenue: 4.2, latency: 3.4 });
            
            useEffect(() => {
                const interval = setInterval(() => {
                    setMetrics(prev => ({
                        leads: prev.leads + Math.floor(Math.random() * 5),
                        revenue: +(prev.revenue + (Math.random() * 0.01)).toFixed(2),
                        latency: +(Math.random() * 2 + 2).toFixed(1)
                    }));
                }, 2000);
                return () => clearInterval(interval);
            }, []);

            return (
                <div className="space-y-6 animate-fade-in">
                    {/* Header */}
                    <div className="flex justify-between items-center">
                        <div>
                            <h2 className="text-2xl font-bold text-slate-900">Executive Overview</h2>
                            <p className="text-slate-500">Real-time ecosystem performance</p>
                        </div>
                        <div className="flex space-x-3">
                            <button className="px-4 py-2 bg-white border border-slate-200 rounded-lg text-sm font-medium text-slate-700 hover:bg-slate-50 flex items-center">
                                <Download className="w-4 h-4 mr-2" /> Export Report
                            </button>
                            <button className="px-4 py-2 bg-indigo-600 text-white rounded-lg text-sm font-medium hover:bg-indigo-700 flex items-center shadow-lg shadow-indigo-200">
                                <Plus className="w-4 h-4 mr-2" /> New Campaign
                            </button>
                        </div>
                    </div>

                    {/* Metrics Grid */}
                    <div className="grid grid-cols-1 md:grid-cols-4 gap-6">
                        {[
                            { label: 'Total Leads', value: metrics.leads.toLocaleString(), change: '+12.5%', icon: Users, color: 'text-blue-600', bg: 'bg-blue-50' },
                            { label: 'Revenue Impact', value: `$${metrics.revenue}M`, change: '+8.2%', icon: TrendingUp, color: 'text-emerald-600', bg: 'bg-emerald-50' },
                            { label: 'Active Swarms', value: '12', change: 'Stable', icon: Brain, color: 'text-purple-600', bg: 'bg-purple-50' },
                            { label: 'System Latency', value: `${metrics.latency}ms`, change: 'Optimal', icon: Activity, color: 'text-amber-600', bg: 'bg-amber-50' },
                        ].map((stat, idx) => (
                            <div key={idx} className="bg-white p-6 rounded-xl border border-slate-200 shadow-sm hover:shadow-md transition-shadow">
                                <div className="flex justify-between items-start mb-4">
                                    <div className={`p-3 rounded-lg ${stat.bg}`}>
                                        <stat.icon className={`w-6 h-6 ${stat.color}`} />
                                    </div>
                                    <span className={`text-xs font-semibold px-2 py-1 rounded-full ${stat.change.includes('+') ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-100 text-slate-600'}`}>
                                        {stat.change}
                                    </span>
                                </div>
                                <h3 className="text-3xl font-bold text-slate-900">{stat.value}</h3>
                                <p className="text-sm text-slate-500 mt-1">{stat.label}</p>
                            </div>
                        ))}
                    </div>

                    {/* Main Content Split */}
                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        {/* Live Swarm Activity */}
                        <div className="lg:col-span-2 bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
                            <div className="p-6 border-b border-slate-100 flex justify-between items-center">
                                <h3 className="font-semibold text-slate-900 flex items-center">
                                    <Brain className="w-5 h-5 mr-2 text-purple-600" /> Live Swarm Activity
                                </h3>
                                <span className="flex items-center text-xs text-emerald-600 font-medium">
                                    <span className="w-2 h-2 bg-emerald-500 rounded-full mr-2 animate-pulse"></span> System Online
                                </span>
                            </div>
                            <div className="divide-y divide-slate-100">
                                {generateSwarmLogs().map((log) => (
                                    <div key={log.id} className="p-4 hover:bg-slate-50 transition-colors flex items-start space-x-4">
                                        <div className={`mt-1 w-2 h-2 rounded-full flex-shrink-0 ${log.status === 'success' ? 'bg-emerald-500' : 'bg-amber-500'}`}></div>
                                        <div className="flex-1">
                                            <p className="text-sm font-medium text-slate-900">{log.action}</p>
                                            <div className="flex items-center mt-1 space-x-2">
                                                <span className="text-xs text-slate-500 bg-slate-100 px-2 py-0.5 rounded">{log.agent}</span>
                                                <span className="text-xs text-slate-400">• {log.time}</span>
                                            </div>
                                        </div>
                                        <button className="text-slate-400 hover:text-indigo-600">
                                            <MoreHorizontal className="w-4 h-4" />
                                        </button>
                                    </div>
                                ))}
                            </div>
                            <div className="p-4 bg-slate-50 border-t border-slate-100 text-center">
                                <button className="text-sm text-indigo-600 font-medium hover:text-indigo-700">View All Swarm Logs</button>
                            </div>
                        </div>

                        {/* System Health */}
                        <div className="bg-white rounded-xl border border-slate-200 shadow-sm p-6">
                            <h3 className="font-semibold text-slate-900 mb-4 flex items-center">
                                <Shield className="w-5 h-5 mr-2 text-emerald-600" /> Security & Health
                            </h3>
                            <div className="space-y-4">
                                {[
                                    { label: 'Data Encryption', status: 'Active', icon: Shield },
                                    { label: 'Row-Level Security', status: 'Enforced', icon: LockIcon },
                                    { label: 'Audit Logging', status: 'Recording', icon: FileText },
                                    { label: 'DDoS Protection', status: 'Active', icon: Activity },
                                ].map((item, idx) => (
                                    <div key={idx} className="flex items-center justify-between p-3 bg-slate-50 rounded-lg">
                                        <div className="flex items-center space-x-3">
                                            <item.icon className="w-4 h-4 text-slate-500" />
                                            <span className="text-sm font-medium text-slate-700">{item.label}</span>
                                        </div>
                                        <span className="text-xs font-semibold text-emerald-600 bg-emerald-50 px-2 py-1 rounded-full">{item.status}</span>
                                    </div>
                                ))}
                            </div>
                            <div className="mt-6 pt-6 border-t border-slate-100">
                                <div className="flex justify-between items-center mb-2">
                                    <span className="text-xs font-medium text-slate-500">Storage Usage</span>
                                    <span className="text-xs font-bold text-slate-900">42%</span>
                                </div>
                                <div className="w-full bg-slate-100 rounded-full h-2">
                                    <div className="bg-indigo-600 h-2 rounded-full" style={{ width: '42%' }}></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // 4. CRM View
        const CRMView = () => {
            const [leads] = useState(generateLeads(15));
            const [filter, setFilter] = useState('All');

            const filteredLeads = filter === 'All' ? leads : leads.filter(l => l.status === filter);

            return (
                <div className="space-y-6 animate-fade-in h-full flex flex-col">
                    <div className="flex justify-between items-center">
                        <div>
                            <h2 className="text-2xl font-bold text-slate-900">Contact Intelligence</h2>
                            <p className="text-slate-500">Manage leads, merge duplicates, and track lifecycles</p>
                        </div>
                        <div className="flex space-x-3">
                            <div className="relative">
                                <Search className="absolute left-3 top-1/2 transform -translate-y-1/2 w-4 h-4 text-slate-400" />
                                <input 
                                    type="text" 
                                    placeholder="Search contacts..." 
                                    className="pl-10 pr-4 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 w-64"
                                />
                            </div>
                            <button className="px-4 py-2 bg-indigo-600 text-white rounded-lg text-sm font-medium hover:bg-indigo-700 flex items-center">
                                <Plus className="w-4 h-4 mr-2" /> Add Contact
                            </button>
                        </div>
                    </div>

                    {/* Filters */}
                    <div className="flex space-x-2 overflow-x-auto pb-2 scrollbar-hide">
                        {['All', 'New', 'Contacted', 'Qualified', 'Closed'].map(status => (
                            <button
                                key={status}
                                onClick={() => setFilter(status)}
                                className={`px-4 py-2 rounded-full text-sm font-medium whitespace-nowrap transition-colors ${
                                    filter === status 
                                        ? 'bg-slate-900 text-white' 
                                        : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-50'
                                }`}
                            >
                                {status}
                            </button>
                        ))}
                    </div>

                    {/* Table */}
                    <div className="bg-white rounded-xl border border-slate-200 shadow-sm flex-1 overflow-hidden flex flex-col">
                        <div className="overflow-x-auto flex-1">
                            <table className="w-full text-left">
                                <thead className="bg-slate-50 border-b border-slate-200">
                                    <tr>
                                        <th className="px-6 py-4 text-xs font-semibold text-slate-500 uppercase tracking-wider">Contact</th>
                                        <th className="px-6 py-4 text-xs font-semibold text-slate-500 uppercase tracking-wider">Company</th>
                                        <th className="px-6 py-4 text-xs font-semibold text-slate-500 uppercase tracking-wider">Status</th>
                                        <th className="px-6 py-4 text-xs font-semibold text-slate-500 uppercase tracking-wider">Lead Score</th>
                                        <th className="px-6 py-4 text-xs font-semibold text-slate-500 uppercase tracking-wider">Last Active</th>
                                        <th className="px-6 py-4 text-xs font-semibold text-slate-500 uppercase tracking-wider text-right">Actions</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-100">
                                    {filteredLeads.map((lead) => (
                                        <tr key={lead.id} className="hover:bg-slate-50 transition-colors group">
                                            <td className="px-6 py-4">
                                                <div className="flex items-center">
                                                    <img src={lead.avatar} alt="" className="w-8 h-8 rounded-full mr-3" />
                                                    <div>
                                                        <div className="text-sm font-medium text-slate-900">{lead.name}</div>
                                                        <div className="text-xs text-slate-500">{lead.email}</div>
                                                    </div>
                                                </div>
                                            </td>
                                            <td className="px-6 py-4 text-sm text-slate-600">{lead.company}</td>
                                            <td className="px-6 py-4">
                                                <span className={`px-2.5 py-1 rounded-full text-xs font-medium ${
                                                    lead.status === 'Closed' ? 'bg-emerald-100 text-emerald-700' :
                                                    lead.status === 'Qualified' ? 'bg-blue-100 text-blue-700' :
                                                    'bg-slate-100 text-slate-600'
                                                }`}>
                                                    {lead.status}
                                                </span>
                                            </td>
                                            <td className="px-6 py-4">
                                                <div className="flex items-center">
                                                    <div className="w-16 bg-slate-200 rounded-full h-1.5 mr-2">
                                                        <div 
                                                            className={`h-1.5 rounded-full ${lead.score > 80 ? 'bg-emerald-500' : lead.score > 50 ? 'bg-amber-500' : 'bg-red-500'}`} 
                                                            style={{ width: `${lead.score}%` }}
                                                        ></div>
                                                    </div>
                                                    <span className="text-xs font-medium text-slate-600">{lead.score}</span>
                                                </div>
                                            </td>
                                            <td className="px-6 py-4 text-sm text-slate-500">{lead.lastActive}</td>
                                            <td className="px-6 py-4 text-right">
                                                <button className="text-slate-400 hover:text-indigo-600 opacity-0 group-hover:opacity-100 transition-opacity">
                                                    <MoreHorizontal className="w-4 h-4" />
                                                </button>
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                        <div className="p-4 border-t border-slate-200 bg-slate-50 flex justify-between items-center">
                            <span className="text-xs text-slate-500">Showing {filteredLeads.length} of {leads.length} contacts</span>
                            <div className="flex space-x-2">
                                <button className="px-3 py-1 text-xs font-medium bg-white border border-slate-200 rounded hover:bg-slate-50 disabled:opacity-50" disabled>Previous</button>
                                <button className="px-3 py-1 text-xs font-medium bg-white border border-slate-200 rounded hover:bg-slate-50">Next</button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // Helper Icon for Lock
        const LockIcon = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
        );

        // 5. Placeholder Views for other tabs
        const PlaceholderView = ({ title, icon: Icon, description }) => (
            <div className="h-full flex flex-col items-center justify-center text-center animate-fade-in p-8">
                <div className="w-20 h-20 bg-indigo-50 rounded-2xl flex items-center justify-center mb-6">
                    <Icon className="w-10 h-10 text-indigo-600" />
                </div>
                <h2 className="text-2xl font-bold text-slate-900 mb-2">{title}</h2>
                <p className="text-slate-500 max-w-md mb-8">{description}</p>
                <button className="px-6 py-3 bg-indigo-600 text-white rounded-lg font-medium hover:bg-indigo-700 shadow-lg shadow-indigo-200">
                    Initialize Module
                </button>
            </div>
        );

        // Main App Component
        const App = () => {
            const [isLoggedIn, setIsLoggedIn] = useState(false);
            const [activeTab, setActiveTab] = useState('dashboard');

            if (!isLoggedIn) {
                return <LoginScreen onLogin={() => setIsLoggedIn(true)} />;
            }

            const renderContent = () => {
                switch(activeTab) {
                    case 'dashboard': return <DashboardView />;
                    case 'crm': return <CRMView />;
                    case 'swarm': return <PlaceholderView title="AI Swarm Commander" icon={Brain} description="Orchestrate autonomous agents for strategy, creation, and analysis." />;
                    case 'social': return <PlaceholderView title="Social Command Center" icon={Share2} description="Schedule, listen, and engage across all social platforms." />;
                    case 'automation': return <PlaceholderView title="Workflow Automation" icon={Zap} description="Build visual workflows with triggers, actions, and AI branches." />;
                    case 'analytics': return <PlaceholderView title="Advanced Analytics" icon={BarChart3} description="Deep dive into attribution, LTV, and cohort analysis." />;
                    case 'settings': return <PlaceholderView title="System Settings" icon={Settings} description="Manage users, billing, security policies, and integrations." />;
                    default: return <DashboardView />;
                }
            };

            return (
                <div className="flex h-screen bg-slate-50">
                    <Sidebar activeTab={activeTab} setActiveTab={setActiveTab} onLogout={() => setIsLoggedIn(false)} />
                    <main className="flex-1 flex flex-col overflow-hidden">
                        {/* Top Bar */}
                        <header className="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-8">
                            <div className="flex items-center text-slate-400 text-sm">
                                <span className="hover:text-slate-600 cursor-pointer">Workspace</span>
                                <span className="mx-2">/</span>
                                <span className="font-medium text-slate-900 capitalize">{activeTab}</span>
                            </div>
                            <div className="flex items-center space-x-4">
                                <button className="relative p-2 text-slate-400 hover:text-slate-600">
                                    <Bell className="w-5 h-5" />
                                    <span className="absolute top-1.5 right-1.5 w-2 h-2 bg-red-500 rounded-full border-2 border-white"></span>
                                </button>
                                <div className="h-8 w-px bg-slate-200"></div>
                                <button className="flex items-center space-x-2 text-sm font-medium text-slate-700 hover:text-slate-900">
                                    <span>Help & Support</span>
                                </button>
                            </div>
                        </header>

                        {/* Content Area */}
                        <div className="flex-1 overflow-auto p-8">
                            {renderContent()}
                        </div>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
